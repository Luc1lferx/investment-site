<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vantage Bridge — Investor Portal</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="vb-wrap">
    <div class="vb-top">
      <div class="vb-brand"><span class="vb-dot"></span> Investor Portal</div>
      <div class="vb-row">
        <a class="vb-btn" href="./index.html">Home</a>
        <a class="vb-btn vb-btn-primary" href="https://docs.google.com/forms/d/e/1FAIpQLSd5oOZq-yT1fuH2tbAuryfuWsEOQvP1RfPq7AC9ePac1WuLGQ/viewform?usp=dialog" target="_blank" rel="noopener">Apply</a>
      </div>
    </div>

    <div class="vb-glass vb-card" style="max-width:560px; margin:0 auto;">
      <h1 class="vb-h1" style="font-size:34px;">Secure access</h1>
      <p class="vb-sub">Sign in to view your dashboard. New investors can create an account and confirm email before login.</p>

      <div style="margin-top:12px;">
        <label class="vb-label" for="email">Email</label>
        <input class="vb-input" id="email" type="email" autocomplete="email" placeholder="name@email.com" />
      </div>

      <div style="margin-top:10px;">
        <label class="vb-label" for="password">Password</label>
        <input class="vb-input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      <div class="vb-row" style="margin-top:12px;">
        <button class="vb-btn vb-btn-primary" id="signupBtn" style="flex:1;">Create account</button>
        <button class="vb-btn" id="loginBtn" style="flex:1;">Sign in</button>
      </div>

      <div class="vb-status" id="status">Ready.</div>

      <div class="vb-small" style="margin-top:10px;">
        Need help? <a href="mailto:vantagebridge.invest@outlook.com"><b>vantagebridge.invest@outlook.com</b></a>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://vnvfbturajffvtcsjalk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZudmZidHVyYWpmZnZ0Y3NqYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MjYwOTQsImV4cCI6MjA4NjEwMjA5NH0.P_EMszvznKoxvxuL3z61m6T9KzOqbew8qCZ9tTxllvQ";

    const APP_BASE = "https://luc1lferx.github.io/investment-site";
    const DASHBOARD_URL = APP_BASE + "/dashboard.html";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");

    const getCreds = () => ({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    const setStatus = (msg) => statusEl.textContent = msg;

    // If already signed in, go dashboard
    const { data: sess } = await supabase.auth.getSession();
    if (sess?.session) window.location.href = DASHBOARD_URL;

    signupBtn.addEventListener("click", async () => {
      const { email, password } = getCreds();
      if (!email || !password) return setStatus("Enter email + password.");

      signupBtn.disabled = true; loginBtn.disabled = true;
      setStatus("Creating account…");

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: APP_BASE
        }
      });

      signupBtn.disabled = false; loginBtn.disabled = false;

      if (error) return setStatus(error.message);
      setStatus("Account created. Check your email to confirm, then sign in.");
    });

    loginBtn.addEventListener("click", async () => {
      const { email, password } = getCreds();
      if (!email || !password) return setStatus("Enter email + password.");

      signupBtn.disabled = true; loginBtn.disabled = true;
      setStatus("Signing in…");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      signupBtn.disabled = false; loginBtn.disabled = false;

      if (error) return setStatus(error.message);

      // Ensure profile exists (fallback)
      try {
        await supabase.from("profiles").upsert({ user_id: data.user.id, email }, { onConflict: "user_id" });
      } catch {}

      setStatus("Signed in. Redirecting…");
      window.location.href = DASHBOARD_URL;
    });
  </script>
</body>
</html>
