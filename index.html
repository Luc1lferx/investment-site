<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vantage Bridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0b1633, #0f244f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin: 0 0 6px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    p {
      text-align: center;
      opacity: .8;
      margin: 0 0 22px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.10);
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.65);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      font-weight: 700;
    }

    .primary {
      background: #2f7cf6;
      color: #fff;
      margin-bottom: 10px;
    }

    .secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      opacity: .9;
      min-height: 18px;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Vantage Bridge</h1>
    <p>Secure investor access portal</p>

    <input id="email" type="email" placeholder="Email address" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

    <button id="signup" class="primary">Create account</button>
    <button id="login" class="secondary">Sign in</button>

    <div id="status" class="status">Ready</div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- App logic -->
  <script>
    const statusEl = document.getElementById("status");
    const signupBtn = document.getElementById("signup");
    const loginBtn = document.getElementById("login");

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function lockButtons(isLocked) {
      signupBtn.disabled = isLocked;
      loginBtn.disabled = isLocked;
    }

    // Supabase client
    const supabaseClient = supabase.createClient(
      "https://vnvfbturajffvtcsjalk.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZudmZidHVyYWpmZnZ0Y3NqYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MjYwOTQsImV4cCI6MjA4NjEwMjA5NH0.P_EMszvznKoxvxuL3z61m6T9KzOqbew8qCZ9tTxllvQ"
    );

    // Sign up
    signupBtn.addEventListener("click", async () => {
      setStatus("Creating account…");
      lockButtons(true);

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        setStatus("Please enter email + password.");
        lockButtons(false);
        return;
      }

      const { error } = await supabaseClient.auth.signUp({ email, password });

      setStatus(error ? error.message : "Account created. Check your email to confirm.");
      lockButtons(false);
    });

    // Sign in
    loginBtn.addEventListener("click", async () => {
      setStatus("Signing in…");
      lockButtons(true);

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        setStatus("Please enter email + password.");
        lockButtons(false);
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      setStatus(error ? error.message : "Signed in successfully ✅");
      lockButtons(false);
    });
  </script>
</body>
</html>
