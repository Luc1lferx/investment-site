<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vantage Bridge Investments</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #162044, #070b1a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      border-radius: 18px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-weight: 600;
    }

    p {
      text-align: center;
      opacity: 0.75;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #288cfa, #4aa3ff);
      color: white;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .msg {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="glass">
    <h1>Vantage Bridge</h1>
    <p>Secure investor access portal</p>

    <input id="email" type="email" placeholder="Email address" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="signUp()">Create account</button>
    <button class="secondary" onclick="signIn()">Sign in</button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const supabaseUrl = "https://vnvfbturajffvtcsjalk.supabase.co";
    const supabaseKey =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZudmZidHVyYWpmZnZ0Y3NqYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MjYwOTQsImV4cCI6MjA4NjEwMjA5NH0.P_EMszvznKoxvxuL3z61m6T9KzOqbew8qCZ9tTxllvQ";

    const supabase = supabaseJs.createClient(supabaseUrl, supabaseKey);

    async function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signUp({
        email,
        password
      });

      document.getElementById("msg").innerText =
        error ? error.message : "Check your email to confirm your account.";
    }

    async function signIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      document.getElementById("msg").innerText =
        error ? error.message : "Signed in successfully.";
    }
  </script>

</body>
</html>
