<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vantage Bridge – Investor Portal</title>

  <!-- Supabase CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0b1a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 6px;
    }
    p {
      text-align: center;
      opacity: 0.8;
      margin-bottom: 28px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .primary {
      background: #3b82f6;
      color: white;
    }
    .secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
    }
    .status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Vantage Bridge</h1>
    <p>Secure investor access portal</p>

    <input id="email" type="email" placeholder="Email address" />
    <input id="password" type="password" placeholder="Password" />

    <button class="primary" onclick="signUp()">Create account</button>
    <button class="secondary" onclick="signIn()">Sign in</button>

    <div class="status" id="status">Ready</div>
  </div>

<script>
  const SUPABASE_URL = "https://vnvfbturajffvtcsjalk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZudmZidHVyYWpmZnZ0Y3NqYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MjYwOTQsImV4cCI6MjA4NjEwMjA5NH0.P_EMszvznKoxvxuL3z61m6T9KzOqbew8qCZ9tTxllvQ";

  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById("status");

  async function signUp() {
    statusEl.innerText = "Creating account...";
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: "https://luc1lferx.github.io"
      }
    });

    if (error) {
      statusEl.innerText = error.message;
    } else {
      statusEl.innerText = "Account created. Check your email to confirm.";
    }
  }

  async function signIn() {
    statusEl.innerText = "Signing in...";
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      statusEl.innerText = error.message;
    } else {
      statusEl.innerText = "Signed in successfully.";
    }
  }
</script>

</body>
</html>
